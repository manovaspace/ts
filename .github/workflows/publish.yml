name: Publish

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >-
      github.repository_owner == 'manovaspace' && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'release' ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, 'chore: version packages'))
      )
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Publish
        env:
          NPM_CONFIG_PROVENANCE: "true"
          # Optional: set repo secret NPM_TOKEN for first publish of a *new* package name
          # (OIDC trusted publishing cannot create brand-new packages). Remove after trust is configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run release
