name: Publish

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >-
      github.repository_owner == 'manovaspace' && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'release' ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, 'chore: version packages'))
      )
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - name: Publish
        env:
          NPM_CONFIG_PROVENANCE: "true"
          # Optional: set repo secret NPM_TOKEN for first publish of a *new* package name
          # (OIDC trusted publishing cannot create brand-new packages). Remove after trust is configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run release
