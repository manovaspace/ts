name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_commit:
        description: "Merge commit of a version PR to publish (defaults to the pushed commit)"
        required: false
        type: string

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  checks: read
  id-token: write
  contents: read
  pull-requests: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'manovaspace/ts'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - name: Resolve the release token
        id: release_token
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_APP_CLIENT_ID" && -n "$RELEASE_APP_PRIVATE_KEY" ]]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
          elif [[ -n "$RELEASE_TOKEN" ]]; then
            # A PAT works too: pushes made with it trigger the PR's checks, which the
            # reviewed version PR needs. See RELEASING.md.
            echo "mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Set the RELEASE_APP_CLIENT_ID variable and RELEASE_APP_PRIVATE_KEY secret, or the RELEASE_TOKEN secret. See RELEASING.md."
            exit 1
          fi
      - name: Create release app token
        id: release_app
        if: steps.release_token.outputs.mode == 'app'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create or update version PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0; compatible with @changesets/cli v2
        with:
          github-token: ${{ steps.release_token.outputs.mode == 'app' && steps.release_app.outputs.token || secrets.RELEASE_TOKEN }}
          version: bun run version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
      - name: Detect merged version PR
        id: version_pr
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.version_commit || github.sha }}
        run: |
          set -euo pipefail

          associated_prs="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/pulls?per_page=100")"
          matches="$(jq -c --arg sha "$RELEASE_SHA" '
            [flatten[] | select(
              .merged_at != null and
              .merge_commit_sha == $sha and
              .base.ref == "main" and
              .head.ref == "changeset-release/main"
            )]
          ' <<< "$associated_prs")"

          count="$(jq 'length' <<< "$matches")"
          if [[ "$count" == "0" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$count" != "1" ]]; then
            echo "::error::Expected exactly one merged version PR for $GITHUB_SHA, found $count."
            exit 1
          fi

          {
            echo "release=true"
            echo "number=$(jq -r '.[0].number' <<< "$matches")"
            echo "head_sha=$(jq -r '.[0].head.sha' <<< "$matches")"
            echo "author=$(jq -r '.[0].user.login' <<< "$matches")"
            echo "merged_by=$(jq -r '.[0].merged_by.login // ""' <<< "$matches")"
          } >> "$GITHUB_OUTPUT"
      - name: Verify reviewed version PR
        if: steps.version_pr.outputs.release == 'true' && steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.version_pr.outputs.number }}
          PR_HEAD_SHA: ${{ steps.version_pr.outputs.head_sha }}
          PR_AUTHOR: ${{ steps.version_pr.outputs.author }}
          RELEASE_MODE: ${{ steps.release_token.outputs.mode }}
        run: |
          set -euo pipefail

          # With a PAT the version PR is authored by the human who owns the token, so GitHub
          # forbids a separate self-approval. The human merge is then the review: require it to
          # come from the author. The App path (bot author) still needs a distinct approval.
          # The commits -> pulls listing reports merged_by as null, so read it from the PR.
          merged_by="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.merged_by.login // ""')"
          if [[ "$RELEASE_MODE" == "token" && -n "$merged_by" && "$merged_by" == "$PR_AUTHOR" ]]; then
            echo "Version PR #$PR_NUMBER was merged by its author ($merged_by) under the PAT flow; treating the merge as the review."
            exit 0
          fi

          pr_number="$PR_NUMBER"
          pr_head_sha="$PR_HEAD_SHA"
          pr_author="$PR_AUTHOR"
          reviews="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$pr_number/reviews?per_page=100")"
          if ! jq -e --arg head "$pr_head_sha" --arg author "$pr_author" '
            flatten |
            map(select(.commit_id == $head and .user.login != $author and .user.type != "Bot")) |
            sort_by(.user.login, .submitted_at, .id) |
            group_by(.user.login) |
            map(.[-1]) |
            any(.[]; .state == "APPROVED")
          ' <<< "$reviews" >/dev/null; then
            echo "::error::The merged version PR needs a human approval on its latest commit."
            exit 1
          fi

          check_run_pages="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$pr_head_sha/check-runs?per_page=100")"
          if ! jq -e '
            ([.[].check_runs[]]) as $runs |
            ([.[].total_count] | max) as $total_count |
            ($runs | sort_by(.name, .started_at) | group_by(.name) | map(.[-1])) as $latest |
            ($runs | length == $total_count) and
            ($latest | length > 0) and
            all($latest[]; .status == "completed" and .conclusion == "success") and
            any($latest[]; .name == "ci") and
            any($latest[]; .name == "analyze")
          ' <<< "$check_run_pages" >/dev/null; then
            echo "::error::The merged version PR must have successful CI and CodeQL checks on its latest commit."
            exit 1
          fi
      - name: Publish reviewed versions
        if: steps.version_pr.outputs.release == 'true' && steps.changesets.outputs.hasChangesets == 'false'
        run: bun run release
        env:
          NPM_CONFIG_PROVENANCE: "true"
          # Optional: set repo secret NPM_TOKEN for first publish of a *new* package name
          # (OIDC trusted publishing cannot create brand-new packages). Remove after trust is configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
