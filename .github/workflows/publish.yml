name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'manovaspace/ts'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Read pushed commit subject
        id: pushed_commit
        run: echo "subject=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - name: Require release PR token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "::error::Actions secret RELEASE_TOKEN must be available to create/update the reviewed version PR and trigger its checks. See RELEASING.md."
            exit 1
          fi
      - name: Create or update version PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0; compatible with @changesets/cli v2
        with:
          github-token: ${{ secrets.RELEASE_TOKEN }}
          version: bun run version-packages
          commit: chore: version packages
          title: chore: version packages
      - name: Publish reviewed versions
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.pushed_commit.outputs.subject == 'chore: version packages'
        run: bun run release
        env:
          NPM_CONFIG_PROVENANCE: "true"
          # Optional: set repo secret NPM_TOKEN for first publish of a *new* package name
          # (OIDC trusted publishing cannot create brand-new packages). Remove after trust is configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
